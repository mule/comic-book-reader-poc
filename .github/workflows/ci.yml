name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.15'
          python-version: '3.12'
      - run: uv sync --locked
        working-directory: tools
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest
        working-directory: tools
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.3.0'
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm lint && pnpm test && pnpm build
        working-directory: reader
